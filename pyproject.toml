[project]
name = "repro"
version = "0.1.0"
requires-python = ">=3.11"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
    # Tests that wait on a real clock (sandbox timeouts). `make test-fast`
    # deselects them for the inner loop; CI always runs the whole suite.
    "slow: waits on real wall-clock time; deselect with -m 'not slow'",
]
timeout = 120
addopts = "-q"

[tool.ruff]
line-length = 100
src = ["src"]

[tool.ruff.lint]
# Selected explicitly, on purpose. With `select` unset, the effective rule set is
# whatever the installed ruff happens to default to — and requirements.txt said
# `ruff>=0.5`, so CI went red on a ruff RELEASE rather than on any commit: 0.16
# ships a far larger default set (pyupgrade, flake8-comprehensions, ...) than the
# 0.5 this repo was written against. That produced 20 findings inside
# contracts.py, which is frozen and which nobody may reformat unilaterally.
# This is ruff's classic default set plus import sorting. If the lead wants the
# modernisations (Optional[X] -> X | None, datetime.UTC), add "UP" here and let
# ONE person land the contracts.py rewrite in ONE commit.
select = ["E4", "E7", "E9", "F", "I"]
